name: Build & Push Docker Image (Multi-Arch) to GHCR

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # permet de lancer manuellement le build

permissions:
  contents: read
  packages: write  # nécessaire pour pousser sur GitHub Container Registry

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 🧩 Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 🧰 Activer QEMU pour le multi-arch (arm64, amd64, etc.)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 🧱 Activer Docker Buildx (builder moderne)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 Connexion au GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🏷️ Générer automatiquement les métadonnées Docker (tags, labels)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mwkka/brief-pipeline-data-engineering
          tags: |
            type=raw,value=develop
            type=sha

      # 🐳 Build & Push l’image Docker multi-architecture
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
